[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-rl"
version = "0.1.0"
authors = [{ name = "Yousri Ouartsi", email = "yousriouartsi@gmail.com" }]
description = "Cart-pole Reinforcement Learning Project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.12,<4",
    "gymnasium>=1.3,<2",
    "stable-baselines3>=2.9,<3",
    "torch>=2.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tensorboard>=2.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "pyright", "ruff"]

[tool.setuptools.packages.find]
include = ["cartpole_rl*"]

[tool.setuptools.package-data]
cartpole_rl = ["assets/*.xml"]
